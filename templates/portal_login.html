{% extends 'base.html' %}{% block title %}Patient Portal | Shifa Hospital{% endblock %}{% block body %}
<section class="pad"><div class="container" style="max-width:480px"><h2 class="mb-3">Patient portal</h2>
<ul class="nav nav-tabs mb-3"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#li">Log in</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#rg">Register</button></li></ul>
<div class="tab-content"><form id="li" class="tab-pane fade show active needs-validation" novalidate data-api="/api/login"><input type="email" name="email" class="form-control mb-3" placeholder="Email" required><input type="password" name="password" class="form-control mb-3" placeholder="Password" required><button class="btn btn-teal w-100">Log in</button></form>
<form id="rg" class="tab-pane fade needs-validation" novalidate data-api="/api/register"><input name="full_name" class="form-control mb-3" placeholder="Full name" required minlength="3"><input type="email" name="email" class="form-control mb-3" placeholder="Email" required>
<input type="password" name="password" class="form-control mb-1" placeholder="Password" required minlength="8" pattern="(?=.*\d)(?=.*[A-Za-z]).{8,}"><small class="text-mute d-block mb-3">8+ characters with letters and numbers.</small><button class="btn btn-teal w-100">Create account</button></form></div></div></section>{% endblock %}
