{% extends 'base.html' %}{% block body %}<section class="pad"><div class="container" style="max-width:720px"><div class="card-x"><div class="avatar">{{ d.name.split()[1][0] }}{{ d.name.split()[-1][0] }}</div><h2>{{d.name}}</h2><span class="badge badge-teal">{{d.dept}}</span>
<p class="mt-3">{{d.bio}}</p><p class="text-mute">{{d.qualification}} &middot; {{d.experience}} years experience<br>Available: {{d.availability}}</p>
<a class="btn btn-teal" href="/appointment?dept={{d.department_id}}&doctor={{d.id}}">Book Appointment</a> <a class="btn btn-line" href="/doctors">Back to doctors</a></div></div></section>{% endblock %}
